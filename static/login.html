<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tubby · Log in</title>
<style>
  :root { --bg: #f6f5f2; --card: #fff; --ink: #1c1b19; --muted: #6d6a64; --line: #e4e1db; --accent: #e5484d; --accent-ink: #fff; color-scheme: light; }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #141413; --card: #1d1c1a; --ink: #eceae5; --muted: #9a968e; --line: #2e2c29; --accent: #ff6369; --accent-ink: #1a0a0a; color-scheme: dark; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 16px;
         background: var(--bg); color: var(--ink); font: 15px/1.45 ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  form { width: min(340px, 100%); background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 24px; display: grid; gap: 12px; }
  h1 { margin: 0 0 4px; font-size: 22px; }
  input, button { height: 44px; border-radius: 10px; font: inherit; }
  input { border: 1px solid var(--line); background: var(--bg); color: var(--ink); padding: 0 12px; }
  input:focus { outline: 2px solid var(--accent); border-color: transparent; }
  button { border: 0; background: var(--accent); color: var(--accent-ink); font-weight: 600; cursor: pointer; }
  .bad { color: var(--accent); font-size: 14px; margin: 0; }
</style>
</head>
<body>
<form method="post" action="/login">
  <h1>Tubby</h1>
  <p class="bad" id="bad" hidden>Wrong password.</p>
  <input type="password" name="password" placeholder="Password" autocomplete="current-password" required autofocus>
  <button>Log in</button>
</form>
<script>
  if (new URLSearchParams(location.search).has("bad")) document.getElementById("bad").hidden = false;
</script>
</body>
</html>
