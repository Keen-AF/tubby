<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tubby</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='2' y='6' width='28' height='20' rx='6' fill='%23e5484d'/%3E%3Cpath d='M13 11v10l9-5z' fill='white'/%3E%3C/svg%3E">
<style>
  :root {
    --bg: #f6f5f2; --card: #ffffff; --ink: #1c1b19; --muted: #6d6a64; --line: #e4e1db;
    --accent: #e5484d; --accent-ink: #fff; --ok: #2f9e5b; --warn: #b7791f; --bar: #efece6;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #141413; --card: #1d1c1a; --ink: #eceae5; --muted: #9a968e; --line: #2e2c29;
      --accent: #ff6369; --accent-ink: #1a0a0a; --ok: #4cc38a; --warn: #f0b04a; --bar: #2a2926;
      color-scheme: dark;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font: 15px/1.45 ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    padding: max(24px, env(safe-area-inset-top)) 16px max(32px, env(safe-area-inset-bottom));
  }
  main { max-width: 720px; margin: 0 auto; }
  header { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin-bottom: 20px; }
  h1 { font-size: 26px; margin: 0; letter-spacing: -0.02em; display: flex; align-items: center; gap: 10px; }
  h1 svg { width: 30px; height: 30px; }
  .linkish { background: none; border: 0; color: var(--muted); cursor: pointer; font: inherit; padding: 0; }
  .linkish:hover { color: var(--ink); text-decoration: underline; }

  form { display: grid; grid-template-columns: 1fr auto auto; gap: 8px; }
  .field { position: relative; }
  input[type=url], select, button.primary {
    height: 46px; border-radius: 10px; border: 1px solid var(--line); background: var(--card);
    color: var(--ink); font: inherit;
  }
  input[type=url] { width: 100%; padding: 0 76px 0 14px; }
  input[type=url]:focus, select:focus { outline: 2px solid var(--accent); outline-offset: -1px; border-color: transparent; }
  .paste {
    position: absolute; right: 6px; top: 6px; height: 34px; padding: 0 10px; border-radius: 7px;
    border: 1px solid var(--line); background: var(--bg); color: var(--muted); font: inherit; font-size: 13px; cursor: pointer;
  }
  select { padding: 0 10px; cursor: pointer; }
  button.primary {
    padding: 0 22px; background: var(--accent); color: var(--accent-ink); border-color: transparent;
    font-weight: 600; cursor: pointer;
  }
  button.primary:disabled { opacity: .6; cursor: progress; }
  @media (max-width: 560px) {
    form { grid-template-columns: 1fr 1fr; }
    .field { grid-column: 1 / -1; }
  }

  .notice { margin: 12px 2px 0; color: var(--muted); font-size: 13px; display: flex; gap: 6px; align-items: center; }
  .notice svg { flex: none; }
  .formerr { color: var(--accent); font-size: 14px; margin: 10px 2px 0; min-height: 0; }

  #jobs { list-style: none; margin: 24px 0 0; padding: 0; display: grid; gap: 10px; }
  .job { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; }
  .row { display: flex; gap: 12px; align-items: flex-start; justify-content: space-between; }
  .title { font-weight: 600; word-break: break-word; }
  .sub { color: var(--muted); font-size: 13px; margin-top: 2px; word-break: break-all; }
  .actions { display: flex; gap: 6px; flex: none; }
  .actions a, .actions button {
    font: inherit; font-size: 13px; padding: 6px 12px; border-radius: 8px; border: 1px solid var(--line);
    background: transparent; color: var(--ink); cursor: pointer; text-decoration: none; white-space: nowrap;
  }
  .actions a.save { background: var(--ok); border-color: transparent; color: #fff; font-weight: 600; }
  .bar { height: 6px; border-radius: 3px; background: var(--bar); overflow: hidden; margin-top: 12px; }
  .bar > i { display: block; height: 100%; width: 0; background: var(--accent); transition: width .4s ease; }
  .job[data-status=processing] .bar > i { width: 100% !important; animation: pulse 1.2s ease-in-out infinite; }
  .job[data-status=queued] .bar > i { width: 0 !important; }
  @keyframes pulse { 50% { opacity: .45; } }
  .job[data-status=done] .bar, .job[data-status=error] .bar, .job[data-status=cancelled] .bar { display: none; }
  .meta { display: flex; justify-content: space-between; gap: 10px; color: var(--muted); font-size: 12.5px; margin-top: 6px; font-variant-numeric: tabular-nums; }
  .job[data-status=done] .meta { display: none; }
  .err { color: var(--accent); font-size: 13px; margin-top: 8px; word-break: break-word; }
  .empty { color: var(--muted); text-align: center; padding: 40px 0; }

  #find { margin-top: 22px; background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 12px; }
  #search { display: grid; grid-template-columns: 1fr auto; gap: 8px; }
  #q { height: 40px; border-radius: 9px; border: 1px solid var(--line); background: var(--bg); color: var(--ink); font: inherit; padding: 0 12px; width: 100%; }
  #q:focus { outline: 2px solid var(--accent); outline-offset: -1px; border-color: transparent; }
  .ghost {
    font: inherit; font-size: 13px; padding: 0 14px; height: 40px; border-radius: 9px; border: 1px solid var(--line);
    background: transparent; color: var(--ink); cursor: pointer; white-space: nowrap; text-decoration: none;
    display: inline-flex; align-items: center; justify-content: center;
  }
  .ghost:disabled { opacity: .6; cursor: progress; }
  .ghost.small { height: 30px; padding: 0 11px; border-radius: 8px; }
  .ghost.go { background: var(--accent); color: var(--accent-ink); border-color: transparent; font-weight: 600; }
  .ghost.go:disabled { cursor: default; }
  .ghost.go.added { background: var(--ok); color: #fff; opacity: 1; }
  .searchmsg { color: var(--muted); font-size: 13px; margin: 10px 2px 0; }
  .searchmsg.bad { color: var(--accent); }
  .searchmsg:empty { display: none; }

  #preview { margin-top: 12px; }
  .player { position: relative; aspect-ratio: 16 / 9; border-radius: 10px; overflow: hidden; background: #000; }
  .player video { position: absolute; inset: 0; width: 100%; height: 100%; background: #000; }
  .player .pmsg {
    position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; padding: 16px;
    text-align: center; color: #fff; font-size: 14px; background: rgba(0,0,0,.55); pointer-events: none;
  }
  .player .pmsg:empty { display: none; }
  .pv-row { display: flex; gap: 10px; align-items: flex-start; justify-content: space-between; margin-top: 10px; }
  .pv-row .actions { align-items: center; }

  #results { list-style: none; margin: 10px 0 0; padding: 0; display: grid; gap: 2px; max-height: min(430px, 60vh); overflow-y: auto; overscroll-behavior: contain; }
  #results:empty { display: none; }
  .hit { display: grid; grid-template-columns: 128px 1fr auto; gap: 12px; align-items: center; padding: 6px; border-radius: 9px; }
  .hit:hover, .hit.playing { background: var(--bar); }
  .thumb { position: relative; display: block; width: 128px; aspect-ratio: 16 / 9; border-radius: 7px; overflow: hidden; background: var(--bar); border: 0; padding: 0; cursor: pointer; }
  .thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .thumb .len { position: absolute; right: 4px; bottom: 4px; background: rgba(0,0,0,.78); color: #fff; font-size: 11px; font-weight: 600; padding: 1px 5px; border-radius: 4px; font-variant-numeric: tabular-nums; }
  .thumb .len.live { background: var(--accent); color: var(--accent-ink); }
  .hit .info { min-width: 0; cursor: pointer; }
  .hit .t { font-weight: 600; font-size: 14px; line-height: 1.3; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .hit .c { color: var(--muted); font-size: 12.5px; margin-top: 3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .findfoot { display: flex; justify-content: center; gap: 8px; margin-top: 8px; }
  .findfoot:empty { display: none; }
  @media (max-width: 560px) {
    .hit { grid-template-columns: 104px 1fr; }
    .thumb { width: 104px; }
    .hit .ghost.go { grid-column: 2; justify-self: start; }
  }
</style>
</head>
<body>
<main>
  <header>
    <h1>
      <svg viewBox="0 0 32 32" aria-hidden="true"><rect x="2" y="6" width="28" height="20" rx="6" fill="var(--accent)"/><path d="M13 11v10l9-5z" fill="var(--accent-ink)"/></svg>
      Tubby
    </h1>
    <button class="linkish" id="logout" hidden>Log out</button>
  </header>

  <form id="grab" autocomplete="off" novalidate>
    <div class="field">
      <input type="url" id="url" name="url" placeholder="Paste a YouTube link…" required autofocus inputmode="url">
      <button type="button" class="paste" id="paste" hidden>Paste</button>
    </div>
    <select id="preset" aria-label="Quality">
      <option value="best">Best quality</option>
      <option value="1080">1080p</option>
      <option value="720">720p</option>
      <option value="audio">Audio (mp3)</option>
    </select>
    <button class="primary" id="go">Grab</button>
  </form>
  <div class="formerr" id="formerr" role="alert"></div>
  <p class="notice">
    <svg width="14" height="14" viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="7" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M8 4.5v4l2.5 1.5" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
    <span id="notice">Files are deleted from the server a few minutes after you close this window.</span>
  </p>

  <section id="find" aria-label="Find a video">
    <form id="search" role="search" autocomplete="off">
      <input type="search" id="q" placeholder="Or search YouTube…" aria-label="Search YouTube" maxlength="200" enterkeyhint="search">
      <button class="ghost" id="qgo">Search</button>
    </form>
    <div class="searchmsg" id="searchmsg" role="status"></div>
    <div id="preview" hidden>
      <div class="player"></div>
      <div class="pv-row">
        <div>
          <div class="title"></div>
          <div class="sub"></div>
        </div>
        <div class="actions">
          <a class="ghost small" id="pv-open" target="_blank" rel="noopener noreferrer">YouTube ↗</a>
          <button type="button" class="ghost small" id="pv-close">Close</button>
          <button type="button" class="ghost small go" id="pv-grab">Grab</button>
        </div>
      </div>
    </div>
    <ul id="results"></ul>
    <div class="findfoot" id="findfoot"></div>
  </section>

  <ul id="jobs"></ul>
  <div class="empty" id="empty">Nothing yet. Paste a link or search above.</div>
</main>

<template id="job-tpl">
  <li class="job">
    <div class="row">
      <div>
        <div class="title"></div>
        <div class="sub"></div>
      </div>
      <div class="actions">
        <a class="save" hidden>Save</a>
        <button class="cancel" type="button">Cancel</button>
      </div>
    </div>
    <div class="bar"><i></i></div>
    <div class="meta"><span class="left"></span><span class="right"></span></div>
    <div class="err" hidden></div>
  </li>
</template>

<template id="hit-tpl">
  <li class="hit">
    <button type="button" class="thumb" aria-label="Preview"><img alt="" loading="lazy"><span class="len"></span></button>
    <div class="info"><div class="t"></div><div class="c"></div></div>
    <button type="button" class="ghost small go">Grab</button>
  </li>
</template>

<script>
(() => {
  // One session per window: sessionStorage survives reloads (and "reopen closed tab")
  // but not a real close, which is what makes the server forget.
  const sid = (() => {
    let s = sessionStorage.getItem("tubby-sid");
    if (!s) {
      const b = crypto.getRandomValues(new Uint8Array(16));   // works on plain-http LAN too
      s = Array.from(b, x => x.toString(16).padStart(2, "0")).join("");
      sessionStorage.setItem("tubby-sid", s);
    }
    return s;
  })();

  const $ = id => document.getElementById(id);
  const PRESET = { best: "Best", "1080": "1080p", "720": "720p", audio: "MP3" };
  const ACTIVE = new Set(["queued", "downloading", "processing"]);
  const nodes = new Map();
  let active = false;
  let timer;

  async function api(path, opts = {}) {
    const r = await fetch(path, { ...opts, headers: { "X-Tubby-Session": sid, ...(opts.headers || {}) } });
    if (r.status === 401) { location.href = "/login"; throw new Error("login required"); }
    return r;
  }

  const bytes = n => {
    if (n == null) return "";
    const u = ["B", "KB", "MB", "GB", "TB"]; let i = 0;
    while (n >= 1024 && i < u.length - 1) { n /= 1024; i++; }
    return `${n.toFixed(i && n < 10 ? 1 : 0)} ${u[i]}`;
  };
  const dur = s => {
    if (s == null) return "";
    s = Math.round(s);
    return s >= 3600 ? `${Math.floor(s / 3600)}h ${Math.floor(s % 3600 / 60)}m`
         : s >= 60 ? `${Math.floor(s / 60)}m ${s % 60}s` : `${s}s`;
  };

  function render(jobs) {
    const seen = new Set();
    for (const j of jobs) {
      seen.add(j.id);
      let el = nodes.get(j.id);
      if (!el) {
        el = $("job-tpl").content.firstElementChild.cloneNode(true);
        el.dataset.id = j.id;
        nodes.set(j.id, el);
        $("jobs").prepend(el);
      }
      el.dataset.status = j.status;
      el.querySelector(".title").textContent = j.title || j.filename || "Fetching info…";
      el.querySelector(".sub").textContent =
        j.status === "done" ? `${PRESET[j.preset]} · ${bytes(j.size)} · ${j.filename}` : `${PRESET[j.preset]} · ${j.url}`;

      const save = el.querySelector(".save");
      save.hidden = j.status !== "done";
      if (j.status === "done" && !save.href) {
        save.href = `/files/${j.id}?s=${sid}`;
        save.download = j.filename || "";
      }
      const cancel = el.querySelector(".cancel");
      cancel.textContent = ACTIVE.has(j.status) ? "Cancel" : "Remove";

      el.querySelector(".bar > i").style.width = `${j.percent}%`;
      const left = { queued: "Waiting in queue…", processing: "Merging / converting…" }[j.status]
        ?? (j.status === "downloading" ? `${j.stream === "audio" ? "Audio" : "Video"} · ${j.percent.toFixed(1)}%` : "");
      el.querySelector(".left").textContent = j.status === "cancelled" ? "Cancelled" : left;
      el.querySelector(".right").textContent = j.status === "downloading"
        ? [j.speed ? `${bytes(j.speed)}/s` : "", j.eta != null ? `${dur(j.eta)} left` : ""].filter(Boolean).join(" · ") : "";

      const err = el.querySelector(".err");
      err.hidden = j.status !== "error";
      err.textContent = j.error || "";
    }
    for (const [id, el] of nodes) if (!seen.has(id)) { el.remove(); nodes.delete(id); }
    $("empty").hidden = nodes.size > 0;
    active = jobs.some(j => ACTIVE.has(j.status));
  }

  // Polling doubles as the heartbeat that keeps this window's files alive.
  async function poll() {
    clearTimeout(timer);
    try {
      const r = await api("/api/jobs");
      const data = await r.json();
      render(data.jobs);
      $("logout").hidden = !data.auth;
      const mins = Math.round(data.grace / 60);
      $("notice").textContent = data.grace >= 60
        ? `Files are deleted from the server ${mins} minute${mins === 1 ? "" : "s"} after you close this window.`
        : `Files are deleted from the server ${data.grace}s after you close this window.`;
    } catch (e) { /* server restarting or offline: keep trying */ }
    timer = setTimeout(poll, active ? 1000 : 4000);
  }

  async function grab(url) {
    const r = await api("/api/jobs", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ url, preset: $("preset").value }),
    });
    const data = await r.json();
    if (!r.ok) throw new Error(data.error || "Something went wrong.");
    active = true;
    poll();
  }

  $("grab").addEventListener("submit", async e => {
    e.preventDefault();
    const url = $("url").value.trim();
    if (!url) return;
    $("formerr").textContent = "";
    if (!/^https?:\/\/\S+$/i.test(url)) {   // not a link: treat it as a search
      $("url").value = "";
      $("q").value = url;
      return search(url);
    }
    $("go").disabled = true;
    try {
      await grab(url);
      $("url").value = "";
    } catch (err) {
      $("formerr").textContent = err.message;
    } finally {
      $("go").disabled = false;
      $("url").focus();
    }
  });

  // ---- search + preview
  const hits = new Map();          // video id -> result
  const grabbed = new Set();       // video ids queued from here, so buttons stay "Added"
  let query = "", page = 0, searching = 0, previewing = null;

  const clock = s => {
    if (s == null) return "";
    s = Math.round(s);
    const h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60), sec = String(s % 60).padStart(2, "0");
    return h ? `${h}:${String(m).padStart(2, "0")}:${sec}` : `${m}:${sec}`;
  };
  const views = n => n == null ? "" :
    `${new Intl.NumberFormat(undefined, { notation: "compact", maximumFractionDigits: 1 }).format(n)} views`;
  const byline = h => [h.channel, h.live ? "Live now" : views(h.views)].filter(Boolean).join(" · ");

  function markGrabbed(btn, id) {
    const done = grabbed.has(id);
    btn.textContent = done ? "Added ✓" : "Grab";
    btn.classList.toggle("added", done);
    btn.disabled = done;
  }

  async function grabHit(id, btn) {
    const h = hits.get(id);
    if (!h || grabbed.has(id)) return;
    btn.disabled = true;
    btn.textContent = "Adding…";
    try {
      await grab(h.url);
      grabbed.add(id);
      $("searchmsg").className = "searchmsg";
      $("searchmsg").textContent = "";
    } catch (err) {
      $("searchmsg").className = "searchmsg bad";
      $("searchmsg").textContent = err.message;
    }
    document.querySelectorAll(`[data-vid="${id}"] .go, #pv-grab[data-vid="${id}"]`).forEach(b => markGrabbed(b, id));
    if (!grabbed.has(id)) btn.disabled = false;
  }

  function footer() {
    const f = $("findfoot");
    f.replaceChildren();
    if (!query) return;
    if (f.dataset.more === "1") {
      const more = Object.assign(document.createElement("button"), { type: "button", className: "ghost small", textContent: "More results" });
      more.addEventListener("click", () => search(query, page + 1));
      f.append(more);
    }
    const clear = Object.assign(document.createElement("button"), { type: "button", className: "ghost small", textContent: "Clear" });
    clear.addEventListener("click", clearSearch);
    f.append(clear);
  }

  function clearSearch() {
    closePreview();
    query = ""; page = 0; hits.clear();
    $("results").replaceChildren();
    $("searchmsg").textContent = "";
    $("findfoot").dataset.more = "";
    footer();
    $("q").value = "";
  }

  async function search(q, p = 1) {
    q = q.trim();
    if (!q) return;
    const ticket = ++searching;
    if (p === 1) { closePreview(); query = q; hits.clear(); $("results").replaceChildren(); $("findfoot").dataset.more = ""; }
    footer();
    $("qgo").disabled = true;
    $("searchmsg").className = "searchmsg";
    $("searchmsg").textContent = p === 1 ? "Searching…" : "Loading more…";
    try {
      const r = await api(`/api/search?q=${encodeURIComponent(q)}&page=${p}`);
      const data = await r.json();
      if (ticket !== searching) return;   // a newer search took over
      if (!r.ok) throw new Error(data.error || "Search failed.");
      page = p;
      for (const h of data.results) {
        if (hits.has(h.id)) continue;
        hits.set(h.id, h);
        const el = $("hit-tpl").content.firstElementChild.cloneNode(true);
        el.dataset.vid = h.id;
        const img = el.querySelector("img");
        img.onerror = () => { img.hidden = true; };
        img.src = `/api/thumb/${h.id}`;
        const len = el.querySelector(".len");
        len.textContent = h.live ? "LIVE" : clock(h.duration);
        len.classList.toggle("live", h.live);
        len.hidden = !len.textContent;
        el.querySelector(".t").textContent = h.title;
        el.querySelector(".t").title = h.title;
        el.querySelector(".c").textContent = byline(h);
        markGrabbed(el.querySelector(".go"), h.id);
        $("results").append(el);
      }
      $("searchmsg").textContent = hits.size ? "" : "No videos found.";
      $("findfoot").dataset.more = data.more ? "1" : "";
    } catch (err) {
      if (ticket !== searching) return;
      $("searchmsg").className = "searchmsg bad";
      $("searchmsg").textContent = err.message;
    } finally {
      if (ticket === searching) { $("qgo").disabled = false; footer(); }
    }
  }

  function openPreview(id) {
    const h = hits.get(id);
    if (!h) return;
    previewing = id;
    const pv = $("preview");
    // Streamed through Tubby (a small 360-480p copy), so the browser never contacts YouTube.
    stopPlayer();
    const video = Object.assign(document.createElement("video"), {
      controls: true, autoplay: true, playsInline: true, preload: "auto", poster: `/api/thumb/${id}`,
    });
    const msg = Object.assign(document.createElement("div"), { className: "pmsg" });
    pv.querySelector(".player").replaceChildren(video, msg);
    if (h.live) {
      msg.textContent = "Live streams can't be previewed here.";
    } else {
      msg.textContent = "Loading preview…";
      loadPreview(id, video, msg);
    }
    pv.querySelector(".title").textContent = h.title;
    pv.querySelector(".sub").textContent = [byline(h), h.live ? "" : clock(h.duration)].filter(Boolean).join(" · ");
    $("pv-open").href = h.url;
    $("pv-grab").dataset.vid = id;
    markGrabbed($("pv-grab"), id);
    document.querySelectorAll(".hit").forEach(el => el.classList.toggle("playing", el.dataset.vid === id));
    pv.hidden = false;
    pv.scrollIntoView({ behavior: "smooth", block: "nearest" });
  }

  async function loadPreview(id, video, msg) {
    let info;
    try {
      const r = await api(`/api/preview/${id}`);   // the slow part: yt-dlp finds a small copy
      info = await r.json();
      if (!r.ok) throw new Error(info.error || "Preview failed.");
    } catch (err) {
      if (previewing === id) msg.textContent = err.message;
      return;
    }
    if (previewing !== id || !video.isConnected) return;
    video.addEventListener("loadeddata", () => { msg.textContent = ""; }, { once: true });
    video.addEventListener("error", () => { msg.textContent = "Preview failed to load."; }, { once: true });
    if (info.audio) pairAudio(video, `/api/preview/${id}/audio`);
    video.src = `/api/preview/${id}/video`;
  }

  // Most YouTube videos no longer have a small file with both picture and sound, so the
  // preview is often a video-only stream plus an audio-only one. The <video> element (with
  // the controls) leads; a hidden <audio> follows it.
  function pairAudio(video, src) {
    const audio = Object.assign(document.createElement("audio"), { preload: "auto", src });
    video.after(audio);
    let stalled = false;
    const follow = () => { if (Math.abs(audio.currentTime - video.currentTime) > 0.3) audio.currentTime = video.currentTime; };
    const go = () => { if (!video.paused && !stalled) { follow(); audio.play().catch(() => {}); } };
    video.addEventListener("playing", go);
    video.addEventListener("pause", () => audio.pause());
    video.addEventListener("waiting", () => audio.pause());
    video.addEventListener("seeking", () => { audio.currentTime = video.currentTime; });
    video.addEventListener("timeupdate", () => { if (!audio.paused) follow(); });
    video.addEventListener("ratechange", () => { audio.playbackRate = video.playbackRate; });
    video.addEventListener("volumechange", () => { audio.volume = video.volume; audio.muted = video.muted; });
    // If the audio runs dry, hold the picture until it catches up.
    audio.addEventListener("waiting", () => { if (!video.paused) { stalled = true; video.pause(); } });
    audio.addEventListener("canplay", () => { if (stalled) { stalled = false; video.play().catch(() => {}); } });
  }

  function stopPlayer() {
    for (const m of $("preview").querySelectorAll("video, audio")) {
      m.pause(); m.removeAttribute("src"); m.load();   // also aborts the stream
    }
    $("preview").querySelector(".player").replaceChildren();
  }

  function closePreview() {
    previewing = null;
    $("preview").hidden = true;
    stopPlayer();
    document.querySelectorAll(".hit.playing").forEach(el => el.classList.remove("playing"));
  }

  $("search").addEventListener("submit", e => { e.preventDefault(); search($("q").value); });
  $("results").addEventListener("click", e => {
    const hit = e.target.closest(".hit");
    if (!hit) return;
    const id = hit.dataset.vid;
    if (e.target.closest(".go")) return grabHit(id, e.target.closest(".go"));
    if (e.target.closest(".thumb, .info")) id === previewing ? closePreview() : openPreview(id);
  });
  $("pv-close").addEventListener("click", closePreview);
  $("pv-grab").addEventListener("click", e => previewing && grabHit(previewing, e.currentTarget));

  $("jobs").addEventListener("click", async e => {
    const btn = e.target.closest(".cancel");
    if (!btn) return;
    const id = btn.closest(".job").dataset.id;
    btn.disabled = true;
    await api(`/api/jobs/${id}`, { method: "DELETE" }).catch(() => {});
    btn.disabled = false;
    const r = await api("/api/jobs").catch(() => null);
    if (r) render((await r.json()).jobs);
  });

  if (navigator.clipboard?.readText) {   // only available on https/localhost
    $("paste").hidden = false;
    $("paste").addEventListener("click", async () => {
      try { $("url").value = (await navigator.clipboard.readText()).trim(); $("url").focus(); } catch {}
    });
  }

  $("logout").addEventListener("click", async () => {
    await api("/api/logout", { method: "POST" }).catch(() => {});
    location.href = "/login";
  });

  // ?url=... prefills the box (handy for bookmarklets / share shortcuts).
  // ?q=... runs a search (handy as a browser search-engine shortcut).
  const params = new URLSearchParams(location.search);
  const pre = params.get("url"), preq = params.get("q");
  if (pre) $("url").value = pre;
  if (preq) { $("q").value = preq; search(preq); }
  if (pre || preq) history.replaceState(null, "", "/");

  // Tell the server the window is going away; it waits out the grace period
  // before forgetting, and a reload's next poll cancels the countdown.
  addEventListener("pagehide", () => navigator.sendBeacon(`/api/bye?s=${sid}`));

  poll();
})();
</script>
</body>
</html>
